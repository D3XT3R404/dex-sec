
name: Release

# Publish pipeline for DEX-SEC.
#
# Tag a version and everything is released automatically:
#   git tag v0.7.1 && git push origin v0.7.1
#
#   -> PyPI (trusted publishing / OIDC)
#   -> Standalone binaries for Windows, Linux and macOS
#   -> npm wrapper (if NPM_TOKEN is configured)
#   -> Release notes generated from CHANGELOG.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the v prefix)"
        required: true

permissions:
  contents: write
  id-token: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/sync_manual.py
      - run: python tests/selftest.py
      - run: python tests/test_features.py

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: verify
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install --upgrade build twine
      - run: python scripts/sync_manual.py
      - run: python -m build
      - run: twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    name: Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dexsec-windows-x64.exe
            python: "3.11"

          - os: windows-latest
            asset: dexsec-windows-arm64.exe
            python: "3.11"

          - os: ubuntu-latest
            asset: dexsec-linux-x64
            python: "3.11"

          - os: ubuntu-latest
            asset: dexsec-linux-arm64
            python: "3.11"

          - os: macos-latest
            asset: dexsec-macos-x64
            python: "3.11"

          - os: macos-latest
            asset: dexsec-macos-arm64
            python: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e .

      - name: Build the executable
        shell: bash
        run: |
          python -m PyInstaller dexsec.spec \
            --noconfirm \
            --clean \
            --workpath .pyinstaller-build

      - name: Collect
        shell: bash
        run: |
          mkdir -p release

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/dexsec.exe "release/${{ matrix.asset }}"
          else
            cp dist/dexsec "release/${{ matrix.asset }}"
            chmod +x "release/${{ matrix.asset }}"
          fi

          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: release/${{ matrix.asset }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [pypi, binaries]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install --upgrade build
      - run: python scripts/sync_manual.py
      - run: python -m build

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        shell: bash
        run: |
          python scripts/release_notes.py \
            "${{ github.ref_name }}" > release-notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/dexsec-*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}

  npm:
    name: Publish the npm wrapper
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync the version
        run: |
          cd npm
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not configured; skipping npm publish."
            exit 0
          fi

          cd npm
          npm publish --access public
          
