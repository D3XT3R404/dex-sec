[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexsec"
version = "0.7.1"
description = "DEX-SEC — Inside-Out Hybrid Application Security Testing CLI (SAST + safe DAST + auto-remediation)"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DEX-SEC contributors" }]
keywords = [
    "security",
    "sast",
    "dast",
    "appsec",
    "pentest",
    "vulnerability-scanner",
    "code-audit",
    "owasp",
    "sarif",
    "php",
    "javascript",
    "typescript",
    "java",
    "go",
    "csharp",
    "ruby",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0", "anthropic>=0.30.0", "google-generativeai>=0.5.0"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0.0", "build>=1.0.0", "twine>=5.0.0", "pyinstaller>=6.0.0"]

[project.scripts]
dexsec = "dexsec.cli:main"

[project.urls]
Homepage = "https://github.com/D3XT3R404/dex-sec"
Documentation = "https://github.com/D3XT3R404/dex-sec#readme"
Changelog = "https://github.com/D3XT3R404/dex-sec/blob/main/CHANGELOG.md"
Issues = "https://github.com/D3XT3R404/dex-sec/issues"

[tool.setuptools.packages.find]
include = ["dexsec*"]
exclude = ["tests*", "demo*", "sandbox*", "npm*", "docs*"]

[tool.setuptools.package-data]
dexsec = ["py.typed", "manual/*.md"]
